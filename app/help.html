<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
    :root {
        --ink: #0b0d12; --ink2: #161b27; --blue: #1a56db; --yellow: #ffc72c;
        --light: #f2f4f8; --line: #e3e8ef; --gray: #6b7280; --text: #1b2230; --card: #fff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body { font-family: 'DM Sans', system-ui, sans-serif; background: var(--light); color: var(--text); line-height: 1.55; font-size: 15.5px; }
    header { background: var(--ink); color: #fff; padding: 18px 16px 0; position: sticky; top: 0; z-index: 5; }
    .top { max-width: 780px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .brand { font-family: 'DM Sans', sans-serif; font-weight: 800; font-size: 1.45rem; letter-spacing: -.3px; }
    .brand span { color: var(--yellow); }
    .back { color: #c9d2e3; text-decoration: none; font-size: .85rem; font-weight: 700; }
    .lang { display: flex; background: var(--ink2); border-radius: 999px; padding: 3px; }
    .lang button { border: 0; background: transparent; color: #c9d2e3; font: 800 .78rem 'DM Sans'; padding: 6px 12px; border-radius: 999px; cursor: pointer; }
    .lang button.on { background: var(--yellow); color: var(--ink); }
    .mod { max-width: 780px; margin: 12px auto 0; display: flex; gap: 6px; }
    .mod button { border: 1.5px solid #3a4256; background: transparent; color: #c9d2e3; font: 800 .8rem 'DM Sans'; padding: 6px 12px; border-radius: 999px; cursor: pointer; }
    .mod button.on { background: #fff; color: var(--ink); border-color: #fff; }
    @media print { .mod { display: none !important; } }
    nav { max-width: 780px; margin: 14px auto 0; display: flex; gap: 4px; overflow-x: auto; }
    nav button { flex: 1; min-width: 0; border: 0; background: transparent; color: #c9d2e3; font: 800 .86rem 'DM Sans'; padding: 11px 6px 12px; cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
    nav button.on { color: #fff; border-bottom-color: var(--yellow); }
    main { max-width: 780px; margin: 0 auto; padding: 20px 16px 60px; }
    h1 { font-family: 'DM Sans', sans-serif; font-size: 1.55rem; line-height: 1.2; margin-bottom: 6px; color: var(--ink); }
    .lead { color: var(--gray); margin-bottom: 18px; }
    h2 { font-family: 'DM Sans', sans-serif; font-size: 1.12rem; color: var(--ink); margin: 26px 0 8px; padding-top: 4px; }
    h3 { font-size: .98rem; margin: 16px 0 4px; color: var(--ink); }
    p { margin: 6px 0; }
    ul, ol { margin: 6px 0 6px 22px; }
    li { margin: 3px 0; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 4px 16px 12px; margin: 12px 0; }
    .tip { background: #fff8e1; border-left: 4px solid var(--yellow); border-radius: 8px; padding: 10px 12px; margin: 10px 0; font-size: .93rem; }
    .who { display: inline-block; font-size: .7rem; font-weight: 800; letter-spacing: .5px; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; margin-left: 6px; vertical-align: 2px; }
    .who.o { background: #e8efff; color: var(--blue); }
    .who.s { background: #e6f6f0; color: #00875a; }
    .toc { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; margin: 6px 0 4px; }
    .toc a { color: var(--blue); text-decoration: none; font-weight: 700; }
    .toc ol { margin-left: 20px; }
    details { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin: 8px 0; padding: 0 14px; }
    summary { font-weight: 800; cursor: pointer; padding: 13px 0; list-style: none; color: var(--ink); }
    summary::-webkit-details-marker { display: none; }
    summary::before { content: '+'; display: inline-block; width: 18px; color: var(--blue); font-weight: 800; }
    details[open] summary::before { content: '–'; }
    details > div { padding: 0 0 12px 18px; }
    .contact { background: var(--ink); color: #fff; border-radius: 14px; padding: 14px 16px; margin: 22px 0 0; }
    .contact a { color: var(--yellow); font-weight: 700; text-decoration: none; }
    .meta { color: var(--gray); font-size: .85rem; }
    .doc { display: none; } .doc.on { display: block; }
    .k { font-weight: 800; white-space: nowrap; }
    footer { text-align: center; color: var(--gray); font-size: .78rem; padding: 0 16px 30px; }
    /* print / PDF */
    @media print {
        @page { size: A4; margin: 16mm 15mm 16mm; }
        body { background: #fff; font-size: 10.6pt; }
        header, nav, .back, .lang, footer.screen { display: none !important; }
        main { padding: 0; max-width: none; }
        .pdfhead { display: flex !important; }
        details { border: 0; padding: 0; margin: 0 0 8px; break-inside: avoid; }
        details > div { padding: 0 0 4px 0; }
        summary { padding: 4px 0 2px; }
        summary::before, details[open] summary::before { content: none; }
        summary { color: var(--blue); }
        body { font-size: 10pt; line-height: 1.45; }
        h2 { margin: 16px 0 6px; }
        .card { padding: 2px 12px 8px; margin: 8px 0; }
        .contact { padding: 9px 12px; margin-top: 14px; }
        .card, .tip, .toc { break-inside: avoid; }
        h2 { break-after: avoid; }
        .contact { break-inside: avoid; }
        a { color: inherit; }
    }
    .pdfhead { display: none; align-items: center; justify-content: space-between; border-bottom: 3px solid var(--yellow); padding-bottom: 8px; margin-bottom: 14px; }
    .pdfhead .brand { color: var(--ink); font-size: 18pt; }
    .pdfhead .brand span { color: var(--blue); }
    .pdfhead small { color: var(--gray); font-size: 9pt; }
</style>
</head>

<script>
const CONTACT = { phone: '+255 740 116 251', wa: '255740116251', email: 'maternusadriano@gmail.com' };
const TILL = './';
const contactBox = {
    en: `<div class="contact"><b>Keep support</b><br>📞 WhatsApp / call: <a href="https://wa.me/${CONTACT.wa}">${CONTACT.phone}</a><br>✉️ Email: <a href="mailto:${CONTACT.email}">${CONTACT.email}</a></div>`,
    sw: `<div class="contact"><b>Huduma kwa wateja wa Keep</b><br>📞 WhatsApp / simu: <a href="https://wa.me/${CONTACT.wa}">${CONTACT.phone}</a><br>✉️ Barua pepe: <a href="mailto:${CONTACT.email}">${CONTACT.email}</a></div>`
};
const O = { en: '<span class="who o">Owner</span>', sw: '<span class="who o">Mmiliki</span>' };
const S_ = { en: '<span class="who s">Seller</span>', sw: '<span class="who s">Muuzaji</span>' };

const LABELS = {
    en: { guide: '📘 Guide', faq: '❓ FAQ', terms: '📜 Terms', back: '← Keep', foot: 'Keep · Shop POS · a product of MATINYO, Mbeya, Tanzania' },
    sw: { guide: '📘 Mwongozo', faq: '❓ Maswali', terms: '📜 Masharti', back: '← Keep', foot: 'Keep · Mfumo wa mauzo · bidhaa ya MATINYO, Mbeya, Tanzania' }
};

const DOCS = {
/* ═════════════════════════ USER GUIDE ═════════════════════════ */
guide: {
en: () => `
<h1>How to use Keep</h1>
<p class="lead">The full guide for shop owners and sellers. Labels like ${O.en} or ${S_.en} show who usually does each step. Owners and admins can do everything a seller can.</p>
<div class="toc"><ol>
<li><a href="#g1">Getting started</a></li><li><a href="#g2">The seller's screen</a></li><li><a href="#g3">Making a sale</a></li>
<li><a href="#g4">Customers and credit</a></li><li><a href="#g5">Returns and voids</a></li><li><a href="#g6">Stock</a></li>
<li><a href="#g7">Ending a shift and closing the day</a></li><li><a href="#g8">Owner's daily work</a></li><li><a href="#g9">Reports</a></li>
<li><a href="#g10">Money and month end</a></li><li><a href="#g11">Team, permissions and settings</a></li><li><a href="#g12">Plan and payment</a></li>
<li><a href="#g13">Good habits</a></li></ol></div>

<h2 id="g1">1. Getting started</h2>
<div class="card">
<h3>Open and install</h3>
<p>Open the Keep link in Chrome (Android) or Safari (iPhone). Tap <span class="k">📲 Install</span> (or “Add to Home Screen”) so Keep opens like an app from the home screen.</p>
<h3>Sign in</h3>
<ul><li><b>First time?</b> Tap <span class="k">Use your setup code</span>, type the code you got on WhatsApp, and choose your own PIN.</li>
<li>After that: tap your name under <b>Who's working?</b>, or type your phone number (owners can also use their email).</li>
<li>Type your PIN (6–12 numbers) and tap <span class="k">UNLOCK</span>.</li>
<li>Keep signs you out after 10 minutes without use, so nobody can sell in your name.</li>
<li><b>Tap your name</b> (top right on a phone, bottom left on a computer) to change your PIN, switch language, refresh the app, open this guide, or <b>sign out</b> when you leave.</li>
<li><b>Kiswahili or English:</b> tap <b>SW / EN</b> on the sign-in screen, or your name → <b>Kiswahili</b>. Each person's choice is kept on their phone.</li></ul>
<h3>On a computer</h3>
<p>The menu is on the <b>left</b>: Dashboard, Point of Sale and Stock, then <b>Quick</b> links (Accounting, Reports, Find date, Cash-ups, Close day, Customers, Monthly profit, End shift, Settings, User guide). Your name and the account menu are at the bottom.</p>
<h3>Forgot your PIN?</h3>
<ul><li>${S_.en} Ask the owner for a new setup code — they make one in <span class="k">👥 Team</span> → <b>Reset PIN</b> and send it on WhatsApp. You then choose a new PIN yourself.</li>
<li>${O.en} Type your email on the sign-in screen and tap <span class="k">Forgot PIN?</span>. Open the emailed link to set a new PIN (check spam too).</li></ul>
</div>
<div class="tip">📵 <b>No internet?</b> Keep keeps working. Sales are saved on the phone and sent when the internet returns. A bar shows when you are offline and ⏳ shows anything still waiting to send.</div>

<h2 id="g2">2. The seller's screen ${S_.en}</h2>
<div class="card">
<p>Sellers open straight on <b>🛒 Point of Sale</b> and <b>📦 Stock</b>. At the top:</p>
<ul><li><b>Today: N sales</b> — what you have sold today.</li>
<li><span class="k">✍️ Manual sale</span> and <span class="k">💸 Expense</span> — only if the owner allows them (see section 11).</li>
<li><span class="k">👥 Customers</span> — customer list, debts and payments.</li>
<li><span class="k">🔒 END SHIFT</span> — count the drawer at the end of your shift.</li>
<li><b>Your name</b> (top right; bottom left on a computer) → Change my PIN, language, Help, Refresh app, Sign out.</li></ul>
<p>Sellers never see profit, cost prices, balances, banking or savings.</p></div>

<h2 id="g3">3. Making a sale ${S_.en}</h2>
<div class="card"><ol>
<li>Add items: tap them, search, or scan the barcode with <span class="k">📷</span>. A USB or Bluetooth barcode scanner works anywhere on the screen.</li>
<li>Items sold in parts (kg, metres, litres) accept amounts like 1.5. Use + / − or ✏️ to change quantity or price.</li>
<li>For phones and electronics Keep asks for each <b>serial / IMEI</b>. Scan or type it — Keep stops you if it is wrong, belongs to another item, or is already sold.</li>
<li>Optional: <span class="k">👤 Add customer</span>, and <span class="k">🏷️ Discount</span> (sellers can't go above the owner's discount limit).</li>
<li>Payment: <b>💵 Cash</b>, <b>📱 Lipa kwa Simu</b>, <b>📒 Credit</b>, or a mix. Shortcuts: <b>All Cash</b> (green), <b>All Simu</b> (blue), <b>All Credit</b> — the one in use fills in with its colour. For a mix, type the amounts in the boxes. The payment must add up to the total.</li>
<li>Tap <span class="k">✅ CONFIRM SALE</span>.</li>
<li>Tap <span class="k">🧾 Receipt</span>, choose <b>WhatsApp · text</b> or <b>WhatsApp · PDF</b>, and type the customer's number. For a PDF, WhatsApp opens the customer's chat first; come back and tap <b>Send the PDF</b>, then pick that chat. The receipt shows your shop details, warranty and serials.</li></ol>
<div class="tip">🖥️ <b>On a computer</b> the cart stays open on the right, with <b>Clear</b> at the top. Keyboard: <b>/</b> search · <b>Enter</b> add item · <b>F2</b> confirm sale · <b>Esc</b> close.</div></div>

<h2 id="g4">4. Customers and credit</h2>
<div class="card"><ul>
<li>Add a customer (name and phone) in <span class="k">👥 Customers</span>, or while selling.</li>
<li><b>Credit sale:</b> add the customer to the sale and put the unpaid part in <b>📒 On credit</b>. ${S_.en} only if the owner allows credit.</li>
<li><b>Payment of debt:</b> open the customer → <span class="k">💰 RECEIVE PAYMENT</span> → amount → cash or Simu. Keep offers a WhatsApp “thank you” with the balance left.</li>
<li><span class="k">📲 Remind</span> sends a polite WhatsApp reminder of the balance.</li>
<li>Each customer shows their history: purchases, credit, payments and returns.</li></ul></div>

<h2 id="g5">5. Returns and voids</h2>
<div class="card"><ul>
<li><b>Return</b> (${S_.en} if allowed): open the sale (today's sales, the customer's history, or 🔍 SERIAL) → <span class="k">↩️ Return</span> → choose items and quantities → choose <b>back on shelf</b> or <b>damaged</b> → choose how the money goes back: cash, Simu, or off their debt. Keep prints a return receipt.</li>
<li><b>Void</b> ${O.en}: cancels a whole sale that was a mistake (🔍 Find date → the sale → ✖ Void). Stock, money and debt are all put back.</li>
<li>Sales are never deleted — voids and returns stay in the history and the reports.</li></ul></div>

<h2 id="g6">6. Stock</h2>
<div class="card">
<h3>Adding items ${O.en}</h3>
<p><span class="k">➕ ADD ITEM</span>: icon, name, category, how it is sold (piece, kg, metre…), <b>pack size</b> (e.g. a box of 12), <b>part units</b> (e.g. 0.5 kg), selling price, cost, stock, low-stock level, <b>warranty months</b>, <b>Ask for serial / IMEI</b>, <b>expiry date</b> (the soonest on the shelf) and barcode (scan with 📷).</p>
<h3>Services (repairs, installation…) ${O.en}</h3>
<p>Tick <b>✂️ This is a service</b> on an item for work you charge for without stock. Services never run out. At the till you choose who did the work, and <span class="k">✂️ STAFF PAY &amp; CLIENTS</span> on the dashboard shows each person's work and what they are owed. (A barbershop has its own guide — use the <b>💈 Barbershop</b> switch at the top.)</p>
<h3>Receiving goods</h3>
<ul><li><span class="k">📥</span> on an item: <b>Restock</b>. Count in pieces or packs. For serial items scan each serial (📷 scans many in a row). ${O.en} can enter the cost and record the payment.</li>
<li><span class="k">🚚 DELIVERY</span>: a supplier delivery with many items, supplier name, costs and how it was paid. Share the delivery note as PDF. ${S_.en} A seller's delivery waits for the owner to check prices and confirm.</li></ul>
<h3>Counting and checking</h3>
<ul><li><span class="k">📋 COUNT</span>: type the real count for each item (skip blanks). Keep corrects the stock and records who counted.</li>
<li><span class="k">🔍 SERIAL</span>: type or scan a serial / IMEI to see if it is in stock, who bought it and when, and whether the <b>warranty</b> is still valid.</li>
<li>Items running low show yellow, items out show red. The owner sees them on the dashboard and in reports.</li>
<li><b>⏳ Expiry:</b> items expiring within 30 days (or already expired) are counted at the top of Stock — tap it to see only those. When you restock you can enter the expiry date of the new stock.</li></ul>
<h3>🏷️ Shelf labels ${O.en}</h3>
<p><span class="k">🏷️ LABELS</span>: tick the items, choose small (65 per A4 page) or large labels, with or without the price, and print. Items without a barcode get one made, so they can be scanned at the till.</p>
<h3>Excel ${O.en}</h3>
<p><span class="k">📥 EXCEL</span>: download a blank template or your current stock, fill it in Excel, Google Sheets or WPS, and upload it. You see a preview first and choose: add to stock (a delivery), replace with the count (a stocktake), or don't change stock; and whether to update prices.</p></div>

<h2 id="g7">7. Ending a shift and closing the day</h2>
<div class="card">
<h3>End shift ${S_.en}</h3>
<ol><li>Tap <span class="k">🔒 END SHIFT</span>.</li>
<li>Count <b>all</b> the cash in the drawer and type it. Add the Lipa kwa Simu balance if you can see it.</li>
<li>Add any money paid out of the drawer (LUKU, transport, supplier) with a note. Deliveries you paid from the drawer are added for you.</li>
<li>Write a note for the owner if needed, tap <span class="k">✅ SUBMIT CASH-UP</span>, and sign out.</li></ol>
<div class="tip">Expenses already recorded with <b>💸 Expense</b> are taken off the drawer straight away — don't add them again in the cash-up.</div>
<h3>Who closes the day?</h3>
<ul><li>${O.en} The owner closes the day from the dashboard (<span class="k">🔒 CLOSE DAY</span>, see section 8).</li>
<li>${S_.en} If the owner switches on <b>Close the day</b> in 🔐 Permissions, the last seller ticks <b>“I'm the last one today — close the day”</b> when ending their shift. Keep closes the day and prepares the summary to send to the owner's WhatsApp.</li></ul></div>

<h2 id="g8">8. Owner's daily work ${O.en}</h2>
<div class="card">
<h3>📊 Dashboard</h3>
<p>Today's sales (with progress to your daily target and change vs yesterday), cash, Simu, bank and savings balances, and this month's sales, stock bought, expenses and profit. On a computer the day history is on the left and the actions on the right.</p>
<h3>Alerts at the top</h3>
<p>Keep shows a coloured bar when something needs you: cash-ups to review, deliveries to check, items below zero, things that were not saved, the phone clock being wrong, or the trial / subscription ending.</p>
<h3>🧾 Cash-ups</h3>
<p>Open a seller's cash-up to see what they counted against what Keep expected, and whether it is <b>short</b> or <b>over</b>. When you confirm you can: record their paid-outs as expenses, correct the balance to the real count, and add a note.</p>
<h3>🔒 Close day</h3>
<p>Choose the date, check the sellers' cash-ups, optionally type what you counted yourself (cash, Simu, bank), then <span class="k">CLOSE &amp; SEND SUMMARY</span>. The summary (sales, money, expenses, profit, low and out of stock) is ready to send on WhatsApp.</p>
<h3>🔍 Find date</h3>
<p>Open any day to see every sale and money entry, void a sale, or add/delete an entry for that date.</p>
<h3>✨ Business insights</h3>
<p>Tap ✨ on the dashboard for a plain-language review of the last 30 days: profit margin, what you spend on stock, weekday vs weekend sales, whether sales are rising or falling, and tips.</p></div>

<h2 id="g9">9. Reports ${O.en}</h2>
<div class="card">
<p>Dashboard → <span class="k">📄 REPORTS</span>. Pick a period (<b>Today, Yesterday, This week, This month, Last month, This year</b> or your own dates), then tap <b>PDF</b> or <b>Excel</b> on any report.</p>
<ul>
<li><b>Sales:</b> Sales list · Sales by item (quantity, revenue, cost, profit) · Daily sales summary · Sales by seller · Returns &amp; voids</li>
<li><b>Money:</b> Profit &amp; loss · Expenses · Banking, transfers &amp; savings · Cash-ups (shortages and overs per seller)</li>
<li><b>Stock:</b> Stock list &amp; value · Low &amp; out of stock · Stock received · Stock movements (restocks, counts, edits, returns) · Serial / IMEI register (with warranty)</li>
<li><b>Customers:</b> Customer register · Customers who owe (biggest first)</li>
<li><b>Monthly report (detailed):</b> the month at a glance with top sellers, as a PDF.</li></ul>
<p>Reports marked <i>as of now</i> (stock, serials, customers) show today's position whatever period you pick. Send any report on WhatsApp or email, or download it.</p></div>

<h2 id="g10">10. Money and month end ${O.en}</h2>
<div class="card">
<h3>📒 Accounting</h3>
<ul><li><b>💸 Expense</b> — money paid out (rent, LUKU, salaries, supplier…) from cash, Simu or bank.</li>
<li><b>🏦 Bank In</b> / <b>💳 Bank Out</b> — deposits and withdrawals.</li>
<li><b>🔄 Transfer</b> — between cash and Lipa kwa Simu (e.g. cashing out Simu).</li>
<li><b>💰 To Savings</b> — put money aside; it stops counting as working money.</li>
<li><b>⚖️ Set Balance</b> — opening balances, or correcting a balance after counting.</li></ul>
<p>Entries can be added for any date; Keep updates the balances and the day's figures together.</p>
<h3>✍️ Manual sale</h3><p>For money taken without the till (bulk orders, sales while the app was closed). It changes money, not stock. Owners can pick any date; sellers (if allowed) today only.</p>
<h3>📅 Monthly profit and close month</h3><p>See each month's sales, stock bought, expenses and profit. When you close a month you can move part of the profit from bank or cash into savings.</p></div>

<h2 id="g11">11. Team, permissions and settings ${O.en}</h2>
<div class="card">
<p>Tap <b>your name</b> → <span class="k">⚙️ Settings</span> (on a computer: <b>Settings</b> in the left menu). It has four tabs:</p>
<h3>👥 Team</h3>
<ul><li><span class="k">➕ ADD STAFF</span>: name, phone and role — <b>🛒 Seller</b> (sells, receives stock, does cash-ups) or <b>👑 Admin</b> (everything the owner can do). Keep gives you a <b>one-time setup code</b> to send them on WhatsApp; they choose their own PIN.</li>
<li><b>Reset PIN</b> gives a new setup code. Make a seller an admin (or back), and <b>switch an account off</b> when someone leaves. Their past records stay.</li></ul>
<h3>🔐 Permissions — what sellers may do</h3>
<ul><li><b>📒 Sell on credit</b> — let customers take goods and pay later.</li>
<li><b>↩️ Returns &amp; refunds</b> — take goods back and give money back.</li>
<li><b>✍️ Manual sales</b> — record sales made without the till (today only).</li>
<li><b>💸 Expenses</b> — record money paid from the drawer or Lipa kwa Simu.</li>
<li><b>🔒 Close the day</b> — the last seller closes the day and sends you the summary.</li>
<li><b>🏷️ Biggest discount</b> — the most (%) a seller can take off a sale.</li></ul>
<p>Changes save straight away. Admins can always do everything.</p>

faq: {

<h1>Frequently asked questions</h1>
<p class="lead">Quick answers. Can't find yours? Contact Keep support at the bottom.</p>
${[
["How do I get reports?", "Owner: Dashboard → 📄 REPORTS. Choose the period (today, this week, this month, last month, this year or your own dates) and tap PDF or Excel on any of the 16 reports: sales list, sales by item, daily summary, sales by seller, returns & voids, profit & loss, expenses, banking & savings, cash-ups, stock list & value, low & out of stock, stock received, stock movements, serial register, customer register and customers who owe. There is also a detailed monthly report PDF."],

["What can I allow sellers to do?", "In 🔐 Permissions you switch on or off: selling on credit, returns & refunds, manual sales (today only), expenses from the drawer or Simu, closing the day, and the biggest discount (%) a seller may give. Sellers never see profit, cost prices, balances, banking or savings, whatever you allow."],

<h1>Terms of Service &amp; Privacy</h1>
<p class="meta">Version 1.0 · Effective 16 October 2026</p>
<p class="lead">Plain-language terms for shops using Keep. By using Keep, the shop owner agrees to these terms on behalf of the shop and its staff.</p>

<h2>1. Who we are</h2>
<p>Keep is a point-of-sale and shop management service provided by <b>MATINYO</b> (registered with BRELA; owner Maternus Adriano), Mbeya, Tanzania (“Keep”, “we”). The business using Keep is “the shop” or “you”.</p>

<h2>2. The service</h2>
<ul><li>Keep lets you record sales, stock, customers, credit, cash-ups, expenses and reports, on phones, tablets and computers.</li>
<li>We work to keep Keep available and correct, and we improve it over time. Features may change; we tell shops about important changes.</li>
<li>Keep works offline and sends saved records when the internet returns. Records that have not yet been sent exist only on that device.</li></ul>

<h2>3. Accounts and security</h2>
<ul><li>The owner is responsible for who has a login, what permissions they have, and switching accounts off when people leave.</li>
<li>Each person must use their own login and keep their PIN secret. Everything done under a login is recorded in that person's name.</li>
<li>Tell us straight away if you think someone has used an account without permission.</li></ul>

<h2>4. Trial, plans and payment</h2>
<ul><li>New shops may start with a free trial. After that, the shop pays the subscription for its plan, as shown in Keep under 💳 Plan or as agreed with us in writing.</li>
<li>If payment is late beyond the grace period shown in Keep, the till is paused (locked) until payment is recorded. Your data is not deleted while the till is paused.</li>
<li>Plan limits (such as number of staff and items) apply as shown in 💳 Plan. We give at least 30 days' notice before changing a shop's price.</li>
<li>Fees already paid are not refunded for part of a period, unless we have failed to provide the service.</li></ul>

<h2>5. Your data belongs to you</h2>
<p>Everything your shop records in Keep — sales, stock, customers, prices, money and staff — belongs to the shop. You can download a full copy at any time (🏪 Shop → Download full backup), and reports as PDF or Excel.</p>

<h2>6. What Keep can see, and why</h2>
<p>To run the service, Keep's systems hold your shop's records. We look at them only when needed to:</p>
<ul><li>provide support you ask for, and fix problems;</li><li>manage your plan and billing (for example: whether the shop is active, number of staff and items, and transaction counts);</li>

<li>We share data only with the service providers needed to run Keep (our database and hosting is Google Firebase), or when the law requires it.</li></ul>

<h2>7. Your customers' personal data</h2>

<li>We protect personal data with access controls, separation between shops and secure hosting, and we follow the Personal Data Protection Act, 2022 of Tanzania.</li>
<li>Staff and customers can ask the shop to correct or remove their details; we will help the shop do this.</li></ul>

<h2>8. Backups and keeping data</h2>
<ul><li>Keep makes a full backup every night and keeps backups for 30 days.</li>
<li>If a shop stops using Keep, we give the owner a full copy of its data on request. We delete the shop's data within 90 days after it leaves, unless the owner asks us to keep it longer or the law requires it. Deleted data may remain in backups until those backups expire.</li></ul>

<h2>9. Fair use</h2>
<p>Do not use Keep for anything illegal, to record false transactions, to try to get into another shop's data, or to interfere with the service. We may suspend an account that does.</p>

<h2>10. Responsibility</h2>

<h2>11. Ending the service</h2>

<li>Malipo yakichelewa zaidi ya muda wa nyongeza unaoonyeshwa kwenye Keep, till inasimamishwa (inafungwa) hadi malipo yarekodiwe. Taarifa zako hazifutwi wakati till imesimamishwa.</li>
<li>Vikomo vya kifurushi (kama idadi ya wafanyakazi na bidhaa) vinatumika kama vinavyoonyeshwa kwenye 💳 Plan. Tunatoa taarifa ya angalau siku 30 kabla ya kubadilisha bei ya duka.</li>
<li>Ada iliyokwisha kulipwa hairudishwi kwa sehemu ya kipindi, isipokuwa kama tumeshindwa kutoa huduma.</li></ul>

<h2>5. Taarifa zako ni mali yako</h2>
<p>Kila kitu ambacho duka lako linarekodi kwenye Keep — mauzo, stoku, wateja, bei, pesa na wafanyakazi — ni mali ya duka. Unaweza kupakua nakala kamili wakati wowote (🏪 Shop → Download full backup), na ripoti kama PDF au Excel.</p>

<h2>6. Keep inaona nini, na kwa nini</h2>
<p>Ili kuendesha huduma, mifumo ya Keep inahifadhi kumbukumbu za duka lako. Tunaziangalia pale tu inapohitajika ili:</p>
<ul><li>kutoa msaada unaoomba, na kurekebisha matatizo;</li><li>kusimamia kifurushi na malipo yako (mfano: kama duka liko hai, idadi ya wafanyakazi na bidhaa, na idadi ya miamala);</li>
<li>kulinda usalama wa huduma na kuzuia matumizi mabaya; na</li><li>kutimiza takwa la kisheria.</li></ul>
<p><b>Ahadi zetu:</b></p>
<ul><li>Tunatunza siri za taarifa za duka lako.</li>
<li><b>Hatuuzi kamwe</b> taarifa zako, wala hatuzitumii kwa matangazo.</li>
<li><b>Hatushirikishi wala kutumia taarifa za duka moja</b> kwa duka jingine, kwa mshindani, au kwa biashara yetu wenyewe.</li>
<li>Hatutangazi jina la duka lako, takwimu au taarifa zako bila ruhusa yako.</li>
<li>Tunashirikisha taarifa na watoa huduma wanaohitajika kuendesha Keep tu (hifadhidata na uhifadhi wetu ni Google Firebase), au sheria inapotutaka.</li></ul>

<h2>7. Taarifa binafsi za wateja wako</h2>
<ul><li>Unaporekodi wateja (mfano majina na namba za simu kwa ajili ya mikopo), duka linaamua nini kirekodiwe na kwa nini; Keep inazihifadhi kwa niaba yako na kuzitumia kutoa huduma tu.</li>
<li>Duka lirekodi kile tu kinachohitajika, liwaeleze wateja kwa nini linahifadhi taarifa zao, na litumie vikumbusho kwa heshima.</li>
<li>Tunalinda taarifa binafsi kwa udhibiti wa nani anaweza kuziona, kutenganisha maduka, na uhifadhi salama, na tunafuata Sheria ya Ulinzi wa Taarifa Binafsi ya Tanzania, 2022.</li>
<li>Wafanyakazi na wateja wanaweza kuliomba duka kusahihisha au kuondoa taarifa zao; tutalisaidia duka kufanya hivyo.</li></ul>

<h2>8. Nakala za akiba na kuhifadhi taarifa</h2>
<ul><li>Keep inahifadhi nakala kamili kila usiku na kuziweka kwa siku 30.</li>
<li>Duka likiacha kutumia Keep, tunampa mmiliki nakala kamili ya taarifa zake akiomba. Tunafuta taarifa za duka ndani ya siku 90 baada ya kuondoka, isipokuwa mmiliki akiomba tuzihifadhi zaidi au sheria ikitaka. Taarifa zilizofutwa zinaweza kubaki kwenye nakala za akiba hadi nakala hizo ziishe muda.</li></ul>

<h2>9. Matumizi halali</h2>
<p>Usitumie Keep kwa jambo lolote lisilo halali, kurekodi miamala ya uongo, kujaribu kuingia kwenye taarifa za duka jingine, au kuvuruga huduma. Tunaweza kusimamisha akaunti inayofanya hivyo.</p>

<h2>10. Wajibu</h2>
<ul><li>Keep ni chombo cha kukusaidia kuendesha duka lako. Duka linabaki na wajibu wa pesa zake, stoku, bei, kodi na maamuzi yake, na kukagua hesabu za zamu na stoku.</li>
<li>Hatuwajibiki kwa hasara zinazotokana na mambo yaliyo nje ya uwezo wetu (kama kukatika kwa intaneti au umeme, kupotea au kuharibika kwa vifaa, au mfanyakazi kutumia vibaya akaunti yake).</li>
<li>Kwa kadri sheria inavyoruhusu, wajibu wetu wote kwa dai lolote hauzidi ada ambayo duka liliilipa Keep katika miezi 3 kabla ya dai hilo.</li></ul>

<h2>11. Kusitisha huduma</h2>
<ul><li>Unaweza kuacha kutumia Keep wakati wowote kwa kutujulisha. Taarifa zako unabaki nazo (angalia kifungu 8).</li>
<li>Tunaweza kusitisha au kusimamisha huduma kwa kutolipa au matumizi mabaya makubwa, na kwa kawaida tutatoa taarifa kwanza.</li></ul>

<h2>12. Mabadiliko ya masharti haya</h2>
<p>Tunaweza kusasisha masharti haya. Tutayajulisha maduka mabadiliko muhimu angalau siku 14 kabla hayajaanza kutumika. Toleo na tarehe vinaonyeshwa juu.</p>

<h2>13. Sheria</h2>
<p>Masharti haya yanaongozwa na sheria za Jamhuri ya Muungano wa Tanzania. Daima tutajaribu kumaliza tofauti yoyote kwa mazungumzo kwanza.</p>

// ── page logic ──
const qs = new URLSearchParams(location.search);
let lang = qs.get('lang') || (() => { try { return localStorage.getItem('keep.help.lang'); } catch (e) { return null; } })() || ((navigator.language || '').startsWith('sw') ? 'sw' : 'en');
let mod = qs.get('m') || (() => { try { return localStorage.getItem('keep.help.m'); } catch (e) { return null; } })() || 'shop';
if (mod !== 'barbershop') mod = 'shop';
const docFor = d => (mod === 'barbershop' && BARBER[d]) ? BARBER[d] : DOCS[d];
let doc = qs.get('doc') || (location.hash || '').replace('#', '') || 'guide';
if (!DOCS[doc]) doc = 'guide';
if (!DOCS.guide[lang]) lang = 'en';
const TITLES = { guide: { en: 'User Guide', sw: 'Mwongozo wa Matumizi' }, faq: { en: 'FAQ', sw: 'Maswali' }, terms: { en: 'Terms & Privacy', sw: 'Masharti & Faragha' } };

function render() {
    document.documentElement.lang = lang;
    const L = LABELS[lang];
    document.querySelectorAll('#tabs button').forEach(b => { b.textContent = L[b.dataset.d]; b.classList.toggle('on', b.dataset.d === doc); });
    document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.l === lang));
    const pdfHead = `<div class="pdfhead"><div class="brand">Keep<span>.</span></div><small>${TITLES[doc][lang]} · ${lang === 'sw' ? 'Kiswahili' : 'English'} · keep.co.tz</small></div>`;
    document.getElementById('main').innerHTML = pdfHead + docFor(doc)[lang]();
    document.querySelectorAll('#modSwitch button').forEach(b => b.classList.toggle('on', b.dataset.m === mod));
    document.getElementById('foot').textContent = mod === 'barbershop' ? (lang === 'sw' ? 'Keep · Mfumo wa kinyozi · bidhaa ya MATINYO, Mbeya, Tanzania' : 'Keep · Barbershop · a product of MATINYO, Mbeya, Tanzania') : L.foot;
    document.title = 'Keep — ' + TITLES[doc][lang];
    if (qs.get('print') === '1') document.querySelectorAll('details').forEach(d => d.open = true);
    // in-page links (table of contents) scroll without changing the tab
    document.querySelectorAll('.toc a').forEach(a => a.onclick = e => { e.preventDefault(); const t = document.getElementById(a.getAttribute('href').slice(1)); if (t) window.scrollTo({ top: t.getBoundingClientRect().top + scrollY - 120, behavior: 'smooth' }); });
}
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { doc = b.dataset.d; history.replaceState(null, '', '#' + doc); render(); window.scrollTo(0, 0); });
document.querySelectorAll('.lang button').forEach(b => b.onclick = () => { lang = b.dataset.l; try { localStorage.setItem('keep.help.lang', lang); } catch (e) {} render(); });
document.querySelectorAll('#modSwitch button').forEach(b => b.onclick = () => { mod = b.dataset.m; try { localStorage.setItem('keep.help.m', mod); } catch (e) {} render(); window.scrollTo(0, 0); });
window.addEventListener('beforeprint', () => document.querySelectorAll('details').forEach(d => d.open = true));
render();
</script>
