<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keep · Barbershop</title>
<script src="../env.js"></script>
<script src="../lang.js"></script>
<script src="../lang-sw.js"></script>
<meta name="theme-color" content="#0b0d12">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="../icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root { --ink:#0b0d12; --ink2:#1a1f2c; --blue:#1a56db; --blue-soft:#eaf0fd; --yellow:#ffc72c; --pos:#00875a; --pos-soft:#e7f6ef; --red:#dc2626; --red-soft:#fdecec; --amber:#f59e0b; --amber-soft:#fff5e0;
        --bg:#f4f5f8; --card:#ffffff; --line:#e8eaef; --gray:#6b7280; --gray2:#9aa1ae; --r:20px; --shadow:0 1px 2px rgba(16,24,40,.04), 0 4px 14px rgba(16,24,40,.05); }
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html, body { min-height:100%; }
body { font-family:'DM Sans',system-ui,sans-serif; background:var(--bg); color:var(--ink); font-size:15px; line-height:1.35; -webkit-font-smoothing:antialiased; }
button { font-family:inherit; cursor:pointer; color:inherit; transition:transform .12s ease, background .15s, box-shadow .15s, opacity .15s; }
button:active:not(:disabled) { transform:scale(.97); }
input, select, textarea { font-family:inherit; font-size:16px; color:var(--ink); }
.hidden { display:none !important; }
svg.ic { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
@keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
#page > * { animation:fadeUp .22s ease-out both; }

/* slim header */
.top { background:var(--ink); color:#fff; padding:calc(10px + env(safe-area-inset-top)) 16px 10px; display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:40; }
.brand { width:34px; height:34px; border-radius:10px; background:var(--yellow); color:var(--ink); display:flex; align-items:center; justify-content:center; font:800 1.05rem 'Syne'; flex-shrink:0; }
.top .ttl { flex:1; min-width:0; }
.top .ttl b { display:block; font-size:1rem; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.top .ttl span { font-size:.74rem; color:var(--gray2); }
.back { width:34px; height:34px; border-radius:10px; border:0; background:rgba(255,255,255,.08); color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.me-chip { display:inline-flex; align-items:center; gap:6px; height:34px; padding:0 10px 0 4px; border-radius:999px; border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.06); color:#fff; font:600 .8rem 'DM Sans'; flex-shrink:0; }
.me-av { width:26px; height:26px; border-radius:50%; background:var(--yellow); color:var(--ink); display:inline-flex; align-items:center; justify-content:center; font-weight:800; font-size:.78rem; }
.me-chip.staff .me-av { background:#2b3244; color:#fff; }
.me-menu { position:fixed; z-index:9000; top:calc(56px + env(safe-area-inset-top)); right:12px; min-width:250px; background:#fff; color:var(--ink); border-radius:18px; box-shadow:0 18px 50px rgba(0,0,0,.22); padding:8px; animation:fadeUp .14s ease-out; }
.me-menu .mm-head { display:flex; align-items:center; gap:10px; padding:8px 8px 12px; border-bottom:1px solid var(--line); margin-bottom:6px; }
.me-menu .mm-head .me-av { width:38px; height:38px; font-size:1rem; }
.me-menu .mm-sub { font-size:.74rem; color:var(--gray); }
.me-menu button { display:flex; align-items:center; gap:12px; width:100%; border:0; background:none; padding:11px 10px; border-radius:12px; font:500 .9rem 'DM Sans'; text-align:left; }
.me-menu button:hover { background:var(--bg); }
.me-menu svg { width:18px; height:18px; color:var(--gray); }
.me-menu .sep { border-top:1px solid var(--line); margin:6px 0; }
.me-menu .lock, .me-menu .lock svg { color:var(--red); }

/* bottom navigation */
.nav { position:fixed; left:0; right:0; bottom:0; z-index:45; background:rgba(255,255,255,.96); backdrop-filter:blur(12px); border-top:1px solid var(--line); display:flex; justify-content:space-around; padding:8px 8px calc(8px + env(safe-area-inset-bottom)); }
.nav button { flex:1; max-width:110px; border:0; background:none; display:flex; flex-direction:column; align-items:center; gap:3px; font:600 .7rem 'DM Sans'; color:var(--gray2); padding:4px 0; position:relative; }
.nav button .pill { width:54px; height:32px; border-radius:999px; display:flex; align-items:center; justify-content:center; transition:background .2s; }
.nav button.on { color:var(--ink); }
.nav button.on .pill { background:var(--ink); color:var(--yellow); }
.nav .badge { position:absolute; top:0; left:calc(50% + 10px); background:var(--red); color:#fff; border-radius:999px; font-size:.62rem; font-weight:700; min-width:17px; height:17px; display:flex; align-items:center; justify-content:center; padding:0 4px; border:2px solid #fff; }

main { max-width:560px; margin:0 auto; padding:16px 16px 120px; }
.sec { font:700 .82rem 'DM Sans'; color:var(--gray); margin:22px 2px 10px; display:flex; justify-content:space-between; align-items:center; }
.sec:first-child { margin-top:2px; }
.sec a { color:var(--blue); cursor:pointer; font-weight:600; }
.card { background:var(--card); border-radius:var(--r); padding:16px; margin-bottom:10px; box-shadow:var(--shadow); }
.muted { color:var(--gray); font-size:.82rem; }
.row { display:flex; justify-content:space-between; align-items:center; gap:10px; }
.g2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.big-num { font:700 1.6rem 'DM Sans'; letter-spacing:-.5px; }

/* summary strip */
.strip { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:6px; }
.strip > div { background:var(--card); border-radius:16px; padding:12px; box-shadow:var(--shadow); }
.strip span { display:block; font-size:.72rem; color:var(--gray); }
.strip b { display:block; font:700 1.12rem 'DM Sans'; margin-top:2px; letter-spacing:-.3px; }
.strip .y { background:var(--ink); color:#fff; } .strip .y span { color:var(--gray2); } .strip .y b { color:var(--yellow); }

/* chair board */
.board { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.seat { background:var(--card); border-radius:var(--r); padding:14px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:10px; position:relative; overflow:hidden; border:2px solid transparent; transition:border-color .2s; }
.seat.busy { border-color:var(--amber); }
.seat .who { display:flex; align-items:center; gap:10px; }
.av { width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:1rem; flex-shrink:0; position:relative; }
.av i { position:absolute; right:-1px; bottom:-1px; width:13px; height:13px; border-radius:50%; border:2.5px solid #fff; background:var(--pos); }
.seat.busy .av i { background:var(--amber); }
.seat .nm { font-weight:700; font-size:.95rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.seat .rl { font-size:.72rem; color:var(--gray); }
.status { display:inline-flex; align-items:center; gap:6px; font-size:.75rem; font-weight:600; padding:4px 10px; border-radius:999px; align-self:flex-start; }
.status.free { background:var(--pos-soft); color:var(--pos); }
.status.busy { background:var(--amber-soft); color:#9a6200; }
.status .pulse { width:7px; height:7px; border-radius:50%; background:currentColor; animation:pulse 1.6s infinite; }
@keyframes pulse { 50% { opacity:.3; } }
.seat .client { font-size:.85rem; } .seat .client b { font-weight:700; }
.seat .next { font-size:.74rem; color:var(--gray); border-top:1px dashed var(--line); padding-top:8px; }
.seat .cnt { position:absolute; top:12px; right:12px; text-align:right; line-height:1; }
.seat .cnt b { font:700 1.25rem 'DM Sans'; display:block; }
.seat .cnt span { font-size:.64rem; color:var(--gray); }

/* buttons */
.cta { width:100%; border:0; border-radius:16px; padding:15px; font:700 .98rem 'DM Sans'; color:#fff; background:var(--ink); display:flex; align-items:center; justify-content:center; gap:10px; }
.cta.blue { background:var(--blue); } .cta.green { background:var(--pos); } .cta.yellow { background:var(--yellow); color:var(--ink); }
.cta:disabled { opacity:.5; }
.btn-sec { flex:1; padding:13px 12px; border-radius:14px; border:1px solid var(--line); background:#fff; font:600 .88rem 'DM Sans'; display:flex; align-items:center; justify-content:center; gap:8px; }
.btn-sec.blue { color:var(--blue); background:var(--blue-soft); border-color:transparent; } .btn-sec.red { color:var(--red); background:var(--red-soft); border-color:transparent; }
.btn-sm { border:0; border-radius:12px; padding:9px 14px; font:600 .82rem 'DM Sans'; background:var(--ink); color:#fff; display:inline-flex; align-items:center; justify-content:center; gap:6px; }
.btn-sm.green { background:var(--pos); } .btn-sm.blue { background:var(--blue); } .btn-sm.ghost { background:var(--bg); color:var(--ink); } .btn-sm.wide { width:100%; }
.x { width:34px; height:34px; border-radius:50%; border:0; background:var(--bg); display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--gray); }
.x svg { width:16px; height:16px; }

/* staff / earnings cards */
.bcard { background:var(--card); border-radius:var(--r); padding:14px; box-shadow:var(--shadow); }
.bcard .nm { font-weight:700; }
.bcard .rule { font-size:.74rem; color:var(--gray); }
.bcard .count { font:700 1.8rem 'DM Sans'; line-height:1.05; margin-top:8px; letter-spacing:-.5px; }
.bcard .count small { font:500 .8rem 'DM Sans'; color:var(--gray); margin-left:4px; letter-spacing:0; }
.bcard .earn { display:flex; justify-content:space-between; align-items:center; margin-top:10px; padding-top:10px; border-top:1px solid var(--line); font-size:.82rem; }
.bcard .earn b { color:var(--pos); }
.stat-card { background:var(--card); padding:14px; border-radius:16px; box-shadow:var(--shadow); }
.stat-card h4 { font:500 .76rem 'DM Sans'; color:var(--gray); margin-bottom:4px; }
.stat-card p { font:700 1.05rem 'DM Sans'; }
.hero { background:var(--ink); color:#fff; border-radius:var(--r); padding:18px; margin-bottom:10px; position:relative; overflow:hidden; }
.hero::after { content:''; position:absolute; right:-40px; top:-40px; width:160px; height:160px; border-radius:50%; background:radial-gradient(circle, rgba(255,199,44,.25), transparent 70%); }
.hero .mo { font-size:.8rem; color:var(--gray2); }
.hero .big { font:700 2rem 'DM Sans'; color:var(--yellow); letter-spacing:-.8px; margin:2px 0; }
.hero .big small { font-size:.8rem; color:var(--gray2); margin-left:4px; letter-spacing:0; }
.hero .sub { font-size:.8rem; color:#c9cfdb; }
.bar { height:6px; background:rgba(255,255,255,.1); border-radius:3px; margin-top:12px; overflow:hidden; } .bar div { height:100%; background:var(--yellow); border-radius:3px; }
.hero-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px; padding-top:14px; border-top:1px solid rgba(255,255,255,.1); position:relative; z-index:1; }
.hero-grid span { display:block; font-size:.72rem; color:var(--gray2); } .hero-grid b { font-size:1rem; }

/* point of sale */
.staffbar { display:flex; gap:10px; overflow-x:auto; scrollbar-width:none; padding:2px 2px 4px; }
.staffbar::-webkit-scrollbar, .catbar::-webkit-scrollbar { display:none; }
.chair { flex-shrink:0; width:66px; border:0; background:none; display:flex; flex-direction:column; align-items:center; gap:5px; font:600 .76rem 'DM Sans'; color:var(--gray); }
.chair .av { width:50px; height:50px; font-size:1.1rem; box-shadow:0 0 0 3px var(--bg); transition:box-shadow .15s, transform .15s; }
.chair.on { color:var(--ink); }
.chair.on .av { box-shadow:0 0 0 3px #fff, 0 0 0 5.5px var(--ink); transform:scale(1.04); }
.chair span.n { max-width:66px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.catbar { display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; padding:4px 2px 2px; margin:12px 0 4px; }
.catbar button { flex-shrink:0; border:1px solid var(--line); background:#fff; border-radius:999px; padding:8px 14px 8px 10px; font:600 .82rem 'DM Sans'; display:inline-flex; align-items:center; gap:6px; color:var(--ink); }
.catbar button svg { width:16px; height:16px; }
.catbar button.on { background:var(--ink); border-color:var(--ink); color:#fff; }
.tiles { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.tile { background:var(--card); border:2px solid transparent; border-radius:18px; padding:12px; text-align:left; position:relative; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:8px; min-height:118px; }
.tile .icon { width:38px; height:38px; border-radius:12px; display:flex; align-items:center; justify-content:center; }
.tile .icon svg { width:20px; height:20px; }
.tile b { display:block; font-size:.9rem; font-weight:600; line-height:1.25; padding-right:22px; }
.tile .meta { margin-top:auto; display:flex; justify-content:space-between; align-items:baseline; }
.tile .p { font-weight:700; font-size:.9rem; }
.tile .s { font-size:.72rem; color:var(--gray); }
.tile.on { border-color:var(--pos); background:#f6fcf9; }
.tile .q { position:absolute; top:10px; right:10px; background:var(--pos); color:#fff; border-radius:999px; min-width:24px; height:24px; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.78rem; animation:pop .2s ease-out; }
@keyframes pop { from { transform:scale(.4); } to { transform:scale(1); } }
.tile.out { opacity:.45; }
.ticket { position:fixed; left:16px; right:16px; bottom:calc(84px + env(safe-area-inset-bottom)); max-width:528px; margin:0 auto; background:var(--ink); color:#fff; border-radius:18px; padding:12px 14px; display:flex; align-items:center; gap:12px; z-index:44; box-shadow:0 14px 34px rgba(11,13,18,.35); border:0; text-align:left; animation:fadeUp .2s ease-out; }
.ticket .n { width:34px; height:34px; border-radius:50%; background:var(--yellow); color:var(--ink); display:flex; align-items:center; justify-content:center; font-weight:700; flex-shrink:0; }
.ticket .t1 { font:700 .9rem 'DM Sans'; }
.ticket .t2 { font-size:.74rem; color:var(--gray2); }
.ticket .tot { margin-left:auto; font:700 1.05rem 'DM Sans'; color:var(--yellow); white-space:nowrap; }

/* lists */
.li { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); }
.li:last-child { border-bottom:0; }
.li .mx { flex:1; min-width:0; } .li .mx b { display:block; font-size:.92rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.dot { width:38px; height:38px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:.88rem; }
.tag { display:inline-block; border-radius:6px; padding:2px 7px; font:600 .66rem 'DM Sans'; }
.tag.v { background:var(--red-soft); color:var(--red); }
.empty { text-align:center; color:var(--gray); padding:24px 10px; font-size:.88rem; }
.chips { display:flex; gap:8px; flex-wrap:wrap; }
.chip { border:1px solid var(--line); background:#fff; border-radius:999px; padding:8px 14px; font:600 .82rem 'DM Sans'; }
.chip.on { background:var(--ink); color:#fff; border-color:var(--ink); }

/* forms + sheet */
label.f { display:block; font:600 .8rem 'DM Sans'; color:var(--gray); margin:14px 0 6px; }
.in { width:100%; border:1.5px solid var(--line); border-radius:14px; padding:12px 14px; background:#fff; outline:none; transition:border-color .15s, box-shadow .15s; }
.in:focus { border-color:var(--blue); box-shadow:0 0 0 4px var(--blue-soft); }
.seg { display:flex; background:var(--bg); border-radius:14px; padding:4px; gap:4px; }
.seg button { flex:1; border:0; background:none; border-radius:11px; padding:10px 6px; font:600 .82rem 'DM Sans'; color:var(--gray); }
.seg button.on { background:#fff; color:var(--ink); box-shadow:0 1px 4px rgba(0,0,0,.1); }
.ov { position:fixed; inset:0; background:rgba(11,13,18,.5); z-index:60; display:flex; align-items:flex-end; justify-content:center; animation:fade .15s; }
@keyframes fade { from { opacity:0; } }
.modal { background:#fff; width:100%; max-width:560px; max-height:92vh; overflow:auto; border-radius:26px 26px 0 0; padding:10px 18px calc(22px + env(safe-area-inset-bottom)); animation:up .22s cubic-bezier(.2,.8,.2,1); }
.modal::before { content:''; display:block; width:40px; height:5px; border-radius:3px; background:var(--line); margin:0 auto 14px; }
@keyframes up { from { transform:translateY(40px); opacity:.5; } to { transform:none; opacity:1; } }
.modal-title { font:700 1.15rem 'DM Sans'; text-align:center; margin-bottom:14px; }
.tot-line { display:flex; justify-content:space-between; align-items:center; background:var(--bg); border-radius:16px; padding:14px 16px; margin:16px 0 4px; }
.tot-line span { font:600 .85rem 'DM Sans'; color:var(--gray); }
.tot-line b { font:700 1.35rem 'DM Sans'; letter-spacing:-.4px; }
.toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(150px + env(safe-area-inset-bottom)); background:var(--ink); color:#fff; padding:12px 18px; border-radius:14px; font-weight:600; font-size:.88rem; z-index:99; max-width:90vw; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,.25); animation:fadeUp .18s ease-out; }
.toast.err { background:var(--red); }
.note { background:var(--amber-soft); padding:12px 14px; border-radius:14px; font-size:.84rem; margin-bottom:12px; color:#6b4a00; }
.check { display:flex; gap:10px; align-items:center; margin-top:16px; font-weight:500; font-size:.92rem; }
.check input { width:20px; height:20px; accent-color:var(--pos); }
.svc-row { display:flex; align-items:center; gap:8px; padding:6px 8px 6px 12px; border-radius:14px; border:1.5px solid var(--line); margin-bottom:6px; background:#fff; transition:border-color .15s, background .15s; }
.svc-row.on { border-color:var(--pos); background:#f6fcf9; }
.svc-tick { flex:1; display:flex; align-items:center; gap:10px; font-weight:500; font-size:.9rem; min-width:0; cursor:pointer; }
.svc-tick input { width:20px; height:20px; flex-shrink:0; accent-color:var(--pos); }
.svc-row .svc-p { width:92px; flex-shrink:0; padding:9px 8px; text-align:right; font-size:.9rem; }

/* first run */
.login { min-height:100vh; background:var(--ink); display:flex; align-items:center; justify-content:center; padding:24px 16px; }
.login-card { background:#fff; border-radius:26px; padding:26px 20px; width:100%; max-width:440px; animation:fadeUp .25s ease-out; }
.login-logo { display:flex; align-items:center; justify-content:center; gap:10px; font:800 1.6rem 'Syne'; }
.login-logo .brand { width:40px; height:40px; font-size:1.25rem; }
.login-sub { text-align:center; color:var(--gray); font:500 .86rem 'DM Sans'; margin:6px 0 16px; }
</style>

<div id="app"></div>

<script>
'use strict';
// ════════════════════════════════════════════════════════════
//  Keep · Barbershop module (pilot)
//  Barbers are paid by the clients they serve. Records are kept on
//  this device (localStorage) with backup / restore, until the module
//  moves onto Keep's cloud.
// ════════════════════════════════════════════════════════════
const KEY = 'keep.barbershop.v1', APP_VERSION = 1;
const COLORS = ['#1a56db', '#00875a', '#7c3aed', '#dc2626', '#f59e0b', '#0891b2', '#db2777', '#4b5563'];
const ICON = {
    dash: '<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>',
    cut: '<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4L8.12 15.88M14.47 14.48L20 20M8.12 8.12L12 12"/>',
    queue: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
    report: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/>',
    team: '<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>',
    list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',

// ── pay rules: barbers are paid by the clients they serve ──
const PAYTYPES = [['head', 'Per client'], ['service', 'Per service'], ['pct', 'Percentage'], ['rent', 'Chair rent']];
function payDesc(b) { const ty = b.payType || 'pct'; return ty === 'head' ? n0(b.perHead) + ' per client' : ty === 'rent' ? 'Chair rent ' + n0(b.rent) + '/day' : ty === 'service' ? 'Per service' : (b.pct || 0) + '% of service'; }
// what the barber earns from one job (services only; products stay with the shop)
function jobPay(b, svcGross, disc, items) {
    const ty = b.payType || 'pct', svcNet = Math.max(0, svcGross - disc);
    if (ty === 'head') return Math.min(svcNet, Math.round(b.perHead || 0));
    if (ty === 'service') return Math.min(svcNet, items.filter(i => i.t === 's').reduce((a, i) => { const s = D.services.find(x => x.id === i.id); return a + (s && s.cut ? s.cut : 0) * i.qty; }, 0));
    if (ty === 'rent') return svcNet;            // keeps the service money, pays chair rent for each day worked
    return Math.round(svcNet * (b.pct || 0) / 100);
}

// ── owner PIN ──
async function sha(s) { try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('keep-barbershop:' + s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); } catch (e) { return 'p:' + s; } }
function isOwner() { if (U.owner && Date.now() - U.ownerAt > 15 * 60 * 1000) U.owner = false; return U.owner || !D.shop.pin; }
function askPin(ok) {
    if (!D.shop.pin) { ok(); return; }
    modal(`<div class="modal-title">Owner PIN</div><input class="in" id="pinIn" type="password" inputmode="numeric" maxlength="8" autocomplete="off" style="font-size:1.5rem;letter-spacing:8px;text-align:center;">

    const go = async () => { if (await sha($('pinIn').value) === D.shop.pin) { U.owner = true; U.ownerAt = Date.now(); closeModal(); ok(); } else { toast('Wrong PIN', true); $('pinIn').value = ''; } };
    $('pinGo').onclick = go; $('pinIn').onkeydown = e => { if (e.key === 'Enter') go(); }; setTimeout(() => $('pinIn').focus(), 60);
}
function ownerGate(fn) { closeMe(); if (isOwner()) { U.ownerAt = Date.now(); fn(); } else askPin(fn); }

}

    const p = id ? D.products.find(x => x.id === id) : { name: '', price: 0, cost: 0, stock: 0, active: true };
    modal(`<div class="modal-title">${id ? esc(p.name) : 'Add product'}</div><label class="f">Name</label><input class="in" id="epName" value="${esc(p.name)}">
      <div class="g2"><div><label class="f">Sell price</label><input class="in" id="epPrice" type="number" inputmode="numeric" value="${p.price || ''}"></div><div><label class="f">Cost price</label><input class="in" id="epCost" type="number" inputmode="numeric" value="${p.cost || ''}"></div></div>
      ${id ? `<div class="g2"><div><label class="f">In stock</label><input class="in" value="${p.stock}" disabled></div><div><label class="f">Add stock</label><input class="in" id="epAdd" type="number" inputmode="numeric" placeholder="+0"></div></div>`
           : `<label class="f">Opening stock</label><input class="in" id="epStock" type="number" inputmode="numeric" value="0">`}
      <label class="check"><input type="checkbox" id="epAct" ${p.active ? 'checked' : ''}> For sale (shows at the till)</label>
      <button class="cta green" style="margin-top:16px;" id="epSave">Save</button>`);
    $('epSave').onclick = () => { const name = $('epName').value.trim(), price = num($('epPrice').value); if (!name || !(price > 0)) return toast('Enter a name and price', true);
        const v = { name, price, cost: num($('epCost').value), active: $('epAct').checked };
        if (id) { Object.assign(p, v); p.stock += Math.round(num($('epAdd').value)); } else D.products.push({ id: uid(), ...v, stock: Math.round(num($('epStock').value)) });
        persist(); closeModal(); render(); toast('Saved'); };
}

// ════════════ EXPENSES ════════════
const CATS = [['rent', 'Rent'], ['power', 'Electricity (LUKU)'], ['water', 'Water'], ['supplies', 'Supplies'], ['salary', 'Salary'], ['other', 'Other']];
function renderExpenses() {
    if (!isOwner()) return go('dash');
    const L = [...D.expenses].sort((a, b) => b.at - a.at).slice(0, 60), cn = Object.fromEntries(CATS);
    $('page').innerHTML = subHeader('Expenses') + `<main><div class="card">
        <label class="f" style="margin-top:0">Type</label><select class="in" id="exCat">${CATS.map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}</select>
        <div class="g2"><div><label class="f">Amount</label><input class="in" id="exAmt" type="number" inputmode="numeric"></div><div><label class="f">Paid from</label><select class="in" id="exFrom"><option value="cash">Cash</option><option value="mobile">Mobile money</option></select></div></div>
        <label class="f">Note</label><input class="in" id="exNote" placeholder="Optional">
        <button class="cta" style="margin-top:14px;" onclick="addExpense()">Add expense</button></div>
      <div class="sec">Recent</div><div class="card" style="padding:4px 14px;">${L.map(e => `<div class="li"><div class="mx"><b>${esc(cn[e.cat] || e.cat)}${e.note ? ' · ' + esc(e.note) : ''}</b><span class="muted">${e.day} · ${e.from === 'mobile' ? 'Mobile money' : 'Cash'}</span></div><b>${n0(e.amount)}</b><button class="x" onclick="delExpense('${e.id}')">${ic('x')}</button></div>`).join('') || '<div class="empty">No expenses yet.</div>'}</div></main>`;
}
function addExpense() { const amt = num($('exAmt').value); if (!(amt > 0)) return toast('Enter the amount', true); D.expenses.push({ id: uid(), day: dayStr(), at: Date.now(), cat: $('exCat').value, amount: amt, from: $('exFrom').value, note: $('exNote').value.trim() }); persist(); toast('Expense added'); renderExpenses(); }
function delExpense(id) { confirmBox('Delete this expense?', 'Delete', () => { D.expenses = D.expenses.filter(e => e.id !== id); persist(); renderExpenses(); }); }

// ════════════ CLIENTS ════════════
function renderClients() {
    const q = U.cq.toLowerCase();
    const L = D.customers.filter(c => !q || c.name.toLowerCase().includes(q) || (c.phone || '').includes(q)).sort((a, b) => b.lastVisit - a.lastVisit);
    $('page').innerHTML = subHeader('Clients') + `<main><input class="in" id="cq" placeholder="Search name or phone" value="${esc(U.cq)}" oninput="U.cq=this.value;renderClients();const e=$('cq');e.focus();e.setSelectionRange(e.value.length,e.value.length)">
      <div class="card" style="margin-top:10px;padding:4px 14px;">${L.map(c => `<div class="li" style="cursor:pointer;" onclick="clientDetail('${c.id}')"><div class="dot" style="background:var(--blue)">${esc(initial(c.name))}</div><div class="mx"><b>${esc(c.name)}</b><span class="muted">${c.phone ? pretty(c.phone) + ' · ' : ''}${c.visits} visit${c.visits === 1 ? '' : 's'}${c.lastVisit ? ' · last ' + new Date(c.lastVisit).toLocaleDateString('en-GB') : ''}</span></div>${isOwner() ? `<b>${n0(c.spent)}</b>` : ''}</div>`).join('') || '<div class="empty">Clients appear here when you add a name or phone at checkout.</div>'}</div></main>`;
}
function clientDetail(id) { const c = D.customers.find(x => x.id === id); if (!c) return;
    const J = D.jobs.filter(j => j.customerId === id && !j.voided).sort((a, b) => b.at - a.at).slice(0, 30);
    modal(`<div class="modal-title">${esc(c.name)}</div><p class="muted" style="text-align:center;margin-top:-8px;">${c.phone ? pretty(c.phone) + ' · ' : ''}${c.visits} visits</p>
      ${J.map(j => `<div class="li"><div class="mx"><b>${esc(j.items.map(i => i.name).join(', '))}</b><span class="muted">${j.day} · ${esc(j.barberName)}</span></div><b>${n0(j.total)}</b></div>`).join('') || '<div class="empty">No visits.</div>'}
      ${c.phone ? `<button class="cta" style="margin-top:14px;" onclick="window.openView('https://wa.me/${c.phone}','_blank')">${ic('wa')} WhatsApp</button>` : ''}`); }

// ════════════ SHOP SETTINGS ════════════
function renderShop() {
    if (!isOwner()) return go('dash');
    $('page').innerHTML = subHeader('Shop settings') + `<main><div class="card">
        <label class="f" style="margin-top:0">Shop name</label><input class="in" id="stName" value="${esc(D.shop.name)}">
        <div class="g2"><div><label class="f">Phone</label><input class="in" id="stPhone" inputmode="tel" value="${esc(D.shop.phone ? pretty(D.shop.phone) : '')}"></div><div><label class="f">New owner PIN</label><input class="in" id="stPin" type="password" inputmode="numeric" maxlength="8" placeholder="Unchanged"></div></div>
        <label class="f">Address</label><input class="in" id="stAddr" value="${esc(D.shop.address || '')}">
        <label class="f">Receipt message</label><input class="in" id="stFoot" value="${esc(D.shop.footer || '')}" placeholder="e.g. Open daily 8am – 10pm">
        <button class="cta" style="margin-top:16px;" onclick="saveShop()">Save</button></div>
      <p class="muted" style="text-align:center;">Keep · Barbershop v${APP_VERSION} · pilot</p></main>`;
}
async function saveShop() {
    const name = $('stName').value.trim(); if (!name) return toast('Enter the shop name', true);
    const pin = $('stPin').value.trim(); if (pin && !/^\d{4,8}$/.test(pin)) return toast('PIN must be 4–8 digits', true);
    D.shop.name = name; D.shop.phone = normPhone($('stPhone').value); D.shop.address = $('stAddr').value.trim(); D.shop.footer = $('stFoot').value.trim();
    if (pin) D.shop.pin = await sha(pin);
    persist(); render(); toast(pin ? 'Saved — new PIN set' : 'Saved');
}

// ════════════ BACKUP ════════════
function renderBackup() {
    if (!isOwner()) return go('dash');
    $('page').innerHTML = subHeader('Backup') + `<main><div class="note">During the pilot your records are kept on this phone. Download a backup every week and keep it somewhere safe — WhatsApp it to yourself, or save it to Google Drive or email.</div>
      <button class="cta" onclick="downloadBackup()">${ic('save')} Download backup</button>
      <button class="btn-sec" style="width:100%;margin-top:10px;padding:15px;" onclick="$('rsFile').click()">Restore from backup</button>
      <input type="file" id="rsFile" accept="application/json,.json" class="hidden" onchange="restoreBackup(this)">
      <div class="card" style="margin-top:14px;">${[['Sales', D.jobs.length], ['Clients', D.customers.length], ['Expenses', D.expenses.length], ['Last backup', D.lastBackup ? new Date(D.lastBackup).toLocaleString('en-GB') : 'Never']].map(([l, v]) => `<div class="row" style="padding:5px 0;"><span class="muted">${l}</span><b>${v}</b></div>`).join('')}</div></main>`;
}
function downloadBackup() { D.lastBackup = Date.now(); persist(); dl(new Blob([JSON.stringify({ app: 'keep-barbershop', madeAt: new Date().toISOString(), data: D })], { type: 'application/json' }), `Keep_Barbershop_backup_${dayStr()}.json`); renderBackup(); }
function restoreBackup(input) {
    const f = input.files && input.files[0]; input.value = ''; if (!f) return;
    const r = new FileReader(); r.onload = () => { try { const o = JSON.parse(r.result); if (o.app !== 'keep-barbershop' || !o.data || o.data.v !== 1) throw 0;
        confirmBox('Replace everything on this phone with this backup?', 'Restore', () => { D = o.data; persist(); go('dash'); toast('Backup restored'); }); } catch (e) { toast('This file is not a Keep Barbershop backup', true); } };
    r.readAsText(f);
}

// ── boot ──
render();
setInterval(() => { if ((U.tab === 'queue' || U.tab === 'chairs') && !U.view && !$('ov') && !($('qName') && ($('qName').value || document.activeElement === $('qName')))) render(); }, 30000);
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
